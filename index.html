<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes voyages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#EEF1EC;--surface:#fff;--ink:#1B2420;--mute:#5E6B64;--line:#D5DDD6;--accent:#B3261E;--accent-ink:#fff;--sun:#E8B23A;--ok:#2E8B57;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121916;--surface:#1B2621;--ink:#EAF0EC;--mute:#98A89F;--line:#2D3C35;--accent:#E0574D;--accent-ink:#1a0805;--bad:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121916;--surface:#1B2621;--ink:#EAF0EC;--mute:#98A89F;--line:#2D3C35;--accent:#E0574D;--accent-ink:#1a0805;--bad:#F08A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
.hero h1{font-size:clamp(2.4rem,9vw,4rem);font-weight:800;letter-spacing:-.02em;margin:18px 0 8px}
.mute,.item small{color:var(--mute)}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:22px 0}
.trip{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.trip h3{font-size:1.6rem;font-weight:800}
.trip .bar{background:color-mix(in srgb,var(--accent-ink) 25%,transparent);margin:8px 0}
.trip .bar i{background:var(--sun)}
.trip .acts{display:flex;gap:8px;margin-top:6px}
.trip button{background:var(--accent-ink);color:var(--accent)}
.trip button.ghost{background:transparent;color:var(--accent-ink);opacity:.8}
.pass{display:grid;grid-template-columns:1fr auto;background:var(--accent);color:var(--accent-ink);border-radius:22px;overflow:hidden}
.pass .main{padding:26px}
.pass .stub{padding:26px;display:flex;align-items:center;gap:16px;border-left:2px dashed color-mix(in srgb,var(--accent-ink) 45%,transparent);position:relative}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass .stub::before{top:-10px}.pass .stub::after{bottom:-10px}
.pass .sub{margin:0 0 6px;opacity:.85}
.pass h1{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:800;letter-spacing:-.02em;word-break:break-word}
.pass .dates{margin:10px 0 0;font-weight:500}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem}
.stub strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;line-height:1.1}
.stub span{font-size:.85rem;opacity:.9}
details.setup,details.c{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin:12px 0}
summary{cursor:pointer;padding:13px 0;font-weight:700;display:flex;justify-content:space-between;gap:10px}
summary small{font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding-bottom:16px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
:is(input,select,button,summary):focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent;color:var(--mute);padding:4px 8px;font-weight:500}
button.ghost:hover{color:var(--bad)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 14px;padding-bottom:4px}
nav.tabs button{background:transparent;color:var(--mute);white-space:nowrap;border:1px solid transparent}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:inset 0 -3px 0 var(--sun)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:1.1rem;display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.card h3 small{font:500 .85rem Figtree,sans-serif;color:var(--mute)}
.alert{border-left:5px solid var(--sun)}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item label{flex:1;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}
.item.done label span{text-decoration:line-through;color:var(--mute)}
.item .grow{flex:1;overflow-wrap:anywhere}
.add{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.add input{flex:1 1 140px}.add select{flex:0 1 140px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{display:block;color:var(--mute);font-size:.85rem}
.stat b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.4rem}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.over i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.empty{color:var(--mute);margin:6px 0}
a{color:var(--accent)}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}.citycard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 -4px 0 var(--sun)}.citycard b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem}.citycard span{color:var(--mute);font-weight:500}.citycard:hover{border-color:var(--accent)}
.foot{text-align:center;margin-top:28px}
.back{margin:0 0 12px -8px}
@media (max-width:560px){.pass{grid-template-columns:1fr}.pass .stub{border-left:0;border-top:2px dashed color-mix(in srgb,var(--accent-ink) 45%,transparent)}.pass .stub::before,.pass .stub::after{top:-10px;left:auto}.pass .stub::before{left:-10px}.pass .stub::after{right:-10px;bottom:auto}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

function fixS(){

    t.v2=1;
    MORE.forEach(([k,gn,its])=>{
      let g=t[k].find(x=>x.name===gn);

      its.forEach(x=>{if(!g.items.some(i=>i.t===x[0]))g.items.push(it(x[0],x[1]))});
    });
  }
  if(t.zh==='中国'&&!t.v4){
    const d=china(),fill=(old,fresh)=>Object.keys(fresh).forEach(k=>{
      if(k==='id'||k==='d'||k==='t')return;
      if(old[k]===undefined||old[k]===null||old[k]==='')old[k]=fresh[k];
    });
    const words=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9\u3400-\u9fff]+/).filter(x=>x.length>2&&!['pour','dans','avec','puis','jour','heure','visite'].includes(x));
    const sameTitle=(x,y)=>{if(x===y)return true;const a=words(x),b=words(y),n=a.filter(w=>b.includes(w)).length;if((String(x).toLowerCase().includes('zhujiajie')&&String(y).toLowerCase().includes('zhujiajiao'))||(String(y).toLowerCase().includes('zhujiajie')&&String(x).toLowerCase().includes('zhujiajiao')))return true;return (n>=2&&n/Math.min(a.length,b.length)>=.65)||(n===1&&a.filter(w=>b.includes(w))[0].length>=7)};
    const cityMatch=(x,y)=>!x||!y||x===y||x.includes(y)||y.includes(x)||(x.includes('Canton')&&y==='Guangzhou')||(y.includes('Canton')&&x==='Guangzhou');
    const oldCities=t.cities||[];
    d.cities.forEach(g=>{
      let old=oldCities.find(x=>x.name===g.name);
      if(!old){oldCities.push(g);return}
      if(!old.note)old.note=g.note;
      g.items.forEach(i=>{
        const prior=old.items.find(x=>sameTitle(x.t,i.t));
        if(prior)fill(prior,i);else old.items.push(i);
      });
    });
    t.cities=oldCities;
    const oldHotels=(t.hotels||[]).filter(x=>!String(x.t||'').startsWith('Zone à rechercher :'));
    d.hotels.forEach(x=>{const prior=oldHotels.find(y=>y.t===x.t&&y.city===x.city);if(prior)fill(prior,x);else oldHotels.push(x)});
    t.hotels=oldHotels;
    d.transp.forEach(x=>{const prior=t.transp.find(y=>y.t===x.t);if(prior)fill(prior,x);else t.transp.push(x)});
    t.transp.forEach(x=>{if(!['Vol','Train','Bus','Voiture ou taxi','Métro','Ferry','Autre'].includes(x.mode))x.mode=String(x.mode||'').includes('avion')?'Autre':String(x.mode||'').includes('Train')?'Train':'Autre'});
    const rest=t.resto||[];
    if(rest.length&&Array.isArray(rest[0].items)){
      d.resto.forEach(g=>{
        let old=rest.find(x=>x.name===g.name||(x.name.includes('Shenzhen')&&g.name.includes('Shenzhen')));
        if(!old){rest.push(g);return}
        g.items.forEach(i=>{const prior=old.items.find(x=>sameTitle(x.t,i.t));if(prior)fill(prior,{...i,city:old.name});else old.items.push(i)});
      });
    }else{
      d.resto.forEach(g=>g.items.forEach(i=>{
        const prior=rest.find(x=>sameTitle(x.t,i.t)&&cityMatch(x.city,g.name));
        if(prior)fill(prior,{...i,city:g.name,dish:i.dish||i.n});
        else rest.push({...i,id:i.id||uid(),d:false,city:g.name,dish:i.dish||i.n});
      }));
    }
    t.resto=rest;
    const sources=t.src||[];
    d.src.forEach(x=>{if(!sources.some(y=>y.t===x.t||y.n===x.n))sources.push(x)});
    t.src=sources;
    t.v4=1;
  }
});
}

function itineraryV(){

for(;d<=end;d.setDate(d.getDate()+1)){

}
h+=`<section class="card"><h3>À savoir</h3><p class="mute" style="margin:0">Pour que l’agenda se remplisse, renseigne une date prévue pour les activités, un jour prévu pour les restaurants, et une date pour chaque transport. Les journées sans élément restent affichées pour te laisser compléter le programme.</p></section>`;

}

let h=`<section class="card"><h3>Parcours conseillé <small>35 jours · juillet 2027</small></h3><p class="mute">Tu arrives à Pékin et le début du séjour laisse trois journées à ta copine pour retrouver sa famille. Les journées de transfert sont incluses. Guangzhou correspond à Canton ; Shenzhen est prévu séparément. Shanghai vient à la fin pour faciliter le départ international.</p></section>`;

const ROUTE_CITIES=[
{n:'Pékin',a:['Pékin','Beijing','北京'],p:[39.9042,116.4074]},
{n:'Xi’an',a:['Xi’an','Xi an','Xian','西安'],p:[34.3416,108.9398]},
{n:'Chengdu',a:['Chengdu','成都'],p:[30.5728,104.0668]},
{n:'Chongqing',a:['Chongqing','重庆'],p:[29.5630,106.5516]},
{n:'Zhangjiajie',a:['Zhangjiajie','张家界'],p:[29.1171,110.4792]},
{n:'Changsha',a:['Changsha','长沙'],p:[28.2282,112.9388]},
{n:'Guangzhou',a:['Guangzhou','Canton','广州','廣州'],p:[23.1291,113.2644]},

const normCity=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function matchRouteCities(s){const q=normCity(s);return ROUTE_CITIES.filter(c=>c.a.some(a=>q.includes(normCity(a))))}
function routeDistance(a,b){const rad=x=>x*Math.PI/180,[la1,lo1]=a.p,[la2,lo2]=b.p,dl=rad(la2-la1),dn=rad(lo2-lo1),z=Math.sin(dl/2)**2+Math.cos(rad(la1))*Math.cos(rad(la2))*Math.sin(dn/2)**2;return 6371*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function bestRouteData(){
const t=T(),dated=[],legs=[];let alt=t.routeChoice||'Hangzhou';
t.cities.forEach(g=>g.items.forEach(i=>{if(/^\d{4}-\d{2}-\d{2}$/.test(i.date||'')){let c=matchRouteCities(i.t||'');if(!c.length)c=matchRouteCities(g.name.split(' · ')[0]);if(normCity(g.name).includes(' ou ')&&c.some(x=>x.n==='Hangzhou')&&c.some(x=>x.n==='Suzhou'))c=[ROUTE_CITIES.find(x=>x.n===(t.routeChoice||'Hangzhou'))];c.filter(Boolean).forEach(x=>dated.push({city:x.n,date:i.date}))}}));
t.resto.forEach(i=>{if(/^\d{4}-\d{2}-\d{2}$/.test(i.day||'')){matchRouteCities(i.city).forEach(x=>dated.push({city:x.n,date:i.day}))}});
t.transp.forEach(i=>{if(/^\d{4}-\d{2}-\d{2}$/.test(i.date||'')){const f=matchRouteCities(i.from||'')[0]||matchRouteCities((i.t||'').split('→')[0])[0],to=matchRouteCities(i.to||'')[0]||matchRouteCities((i.t||'').split('→')[1]||'')[0];if(f&&to&&f.n!==to.n)legs.push([f.n,to.n]);}});
const altEvents=dated.filter(x=>x.city==='Hangzhou'||x.city==='Suzhou').map(x=>x.city);let alternatives=[...new Set(altEvents)];if(!alternatives.length)alternatives=[alt];
const names=['Pékin','Xi’an','Chengdu','Chongqing','Zhangjiajie','Changsha','Guangzhou','Shenzhen',...alternatives,'Shanghai'];
const cities=[...new Set(names)].map(n=>ROUTE_CITIES.find(c=>c.n===n)).filter(Boolean),byDate={};
dated.forEach(e=>{if(!byDate[e.city]||e.date<byDate[e.city])byDate[e.city]=e.date});
const fixedCities=cities.filter(c=>byDate[c.n]).sort((a,b)=>byDate[a.n].localeCompare(byDate[b.n]));
const fixedPairs=[];for(let i=0;i<fixedCities.length;i++)for(let j=i+1;j<fixedCities.length;j++)if(byDate[fixedCities[i].n]<byDate[fixedCities[j].n])fixedPairs.push([fixedCities[i].n,fixedCities[j].n]);
const start=cities.find(c=>c.n==='Pékin'),end=cities.find(c=>c.n==='Shanghai'),middle=cities.filter(c=>c!==start&&c!==end);let best=null,bestScore=Infinity;
const score=order=>{let n=0;for(let i=1;i<order.length;i++)n+=routeDistance(order[i-1],order[i]);const ix=Object.fromEntries(order.map((c,i)=>[c.n,i]));fixedPairs.forEach(([a,b])=>{if(ix[a]>ix[b])n+=1000000});legs.forEach(([a,b])=>{if(ix[a]!=null&&ix[b]!=null&&ix[b]!==ix[a]+1)n+=100000});return n};
function permute(left,order){if(!left.length){const all=[start,...order,end],s=score(all);if(s<bestScore){bestScore=s;best=all}return}for(let i=0;i<left.length;i++)permute(left.filter((_,j)=>j!==i),[...order,left[i]])}
if(start&&end)permute(middle,[]);return{route:best||cities,km:best?best.slice(1).reduce((s,c,i)=>s+routeDistance(best[i],c),0):0,datedCount:dated.length,legs,choice:alternatives.length===1?alternatives[0]:alt,fixedPairs};
}
function setRouteChoice(v){T().routeChoice=v;save();view()}
function bestRouteV(){
if(T().zh!=='中国')return`<section class="card"><h3>Meilleur itinéraire</h3><p class="empty">Le calcul du parcours est préparé pour le voyage en Chine.</p></section>`;
const x=bestRouteData(),route=x.route;let h=`<section class="card"><h3>Parcours optimisé <small>${Math.round(x.km).toLocaleString('fr-FR')} km estimés</small></h3><p class="mute">Calcul recalculé à l’ouverture de cet onglet à partir des villes du voyage et des dates déjà saisies. Le parcours commence à Pékin et se termine à Shanghai, en limitant les détours. Les dates des activités, restaurants et transports imposent leur ordre lorsqu’elles sont renseignées.</p><label class="f" style="display:block;max-width:360px;margin-top:10px">Étape au choix<select onchange="setRouteChoice(this.value)"><option value="Hangzhou" ${x.choice==='Hangzhou'?'selected':''}>Hangzhou</option><option value="Suzhou" ${x.choice==='Suzhou'?'selected':''}>Suzhou</option></select></label></section>`;
h+=`<section class="card"><h3>Ordre conseillé</h3><p class="mute">Distance totale estimée à vol d’oiseau entre les villes, utilisée pour comparer les ordres possibles ; ce n’est pas une distance de train ni un horaire de trajet.</p>`;
h+=route.map((c,i)=>`<div class="item"><div class="grow"><b>${i+1}. ${esc(c.n)}${c.n==='Pékin'?' · arrivée et temps en famille':c.n==='Shanghai'?' · fin de séjour et départ':''}</b>${i<route.length-1?`<br><small>Étape suivante : ${esc(route[i+1].n)} · environ ${Math.round(routeDistance(c,route[i+1])).toLocaleString('fr-FR')} km à vol d’oiseau</small>`:''}</div></div>`).join('');
h+=`</section><section class="card"><h3>Pourquoi cet ordre ?</h3><p class="mute" style="margin:0">Le calcul compare les ordres possibles et minimise les détours géographiques. Les dates saisies dans les activités, les restaurants ou les transports réordonnent les étapes concernées. En cas de dates contradictoires avec l’arrivée à Pékin ou le départ de Shanghai, ces deux points restent fixes. Les horaires réels des trains et des vols ne sont pas intégrés : vérifie les liaisons avant réservation.</p></section>`;
return h
}
